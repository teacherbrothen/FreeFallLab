<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Motion Analysis</title>
  <style>
    :root {
      --bg: #1e293b;
      --card: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --row-active: #0284c7;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 1.5rem;
    }
    .main-layout {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      max-width: 1200px;
      width: 100%;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-card {
      flex: 1 1 480px;
      max-width: 560px;
    }
    .table-card {
      flex: 1 1 420px;
      max-width: 520px;
    }
    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: inline-block;
      max-width: 100%;
      cursor: crosshair;
    }
    video {
      display: block;
      max-height: 60vh;
      max-width: 100%;
    }
    #hairline {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(255, 50, 50, 0.85);
      box-shadow: 0 0 4px rgba(255, 0, 0, 0.9);
      pointer-events: none;
      display: none;
    }
    .readout-panel {
      display: flex;
      gap: 20px;
      margin: 12px 0;
      font-size: 1.15rem;
      font-weight: 600;
      background: #0f172a;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid #475569;
    }
    .readout-panel span {
      color: var(--accent);
      font-family: monospace;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 8px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    button:hover {
      background: #0369a1;
    }
    button.secondary {
      background: #475569;
    }
    button.secondary:hover {
      background: #64748b;
    }
    button.play-active {
      background: #10b981;
      font-weight: 700;
    }
    button.pause-btn {
      background: #ef4444;
    }
    button.pause-btn:hover {
      background: #dc2626;
    }
    /* Table styles */
    .table-container {
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: center;
    }
    th {
      background: #1e293b;
      position: sticky;
      top: 0;
      padding: 8px;
      color: var(--accent);
      border-bottom: 2px solid #475569;
      font-weight: 600;
    }
    td {
      padding: 5px 8px;
      border-bottom: 1px solid #334155;
    }
    tr.active-row {
      background: rgba(2, 132, 199, 0.3) !important;
      font-weight: bold;
    }
    tr:hover {
      background: #1e293b;
      cursor: pointer;
    }
    input.pos-input {
      width: 75px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.95rem;
    }
    input.pos-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #0f172a;
    }
    .vel-cell {
      font-family: monospace;
      color: #a7f3d0;
      font-size: 0.95rem;
    }
    .instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Vertical Motion Analysis</h1>

  <div class="main-layout">
    
    <!-- Left Column: Video & Controls -->
    <div class="card video-card">
      <div class="video-wrapper" id="videoContainer">
        <video id="vid" preload="auto" playsinline>
          <source src="FreeFall.mp4" type="video/mp4">
          <source src="FreeFall.mov" type="video/quicktime">
          Your browser does not support HTML video.
        </video>
        <div id="hairline"></div>
      </div>

      <div class="readout-panel">
        <div>Time: <span id="timeDisplay">0.0000</span> s</div>
        <div>Frame: <span id="frameDisplay">0</span></div>
      </div>

      <!-- Step Controls -->
      <div class="controls">
        <button class="secondary" onclick="step(-7)">« -7 Frames</button>
        <button onclick="step(-1)">‹ -1 Frame</button>
        <button onclick="step(1)">+1 Frame ›</button>
        <button class="secondary" onclick="step(7)">+7 Frames »</button>
        <button class="secondary" onclick="setZero()">Set t = 0</button>
      </div>

      <!-- Playback Controls -->
      <div class="controls">
        <button id="playBtn" class="secondary" onclick="playSloMo()">▶ Play Slo-Mo</button>
        <button id="pauseBtn" class="pause-btn" onclick="pauseVideo()">⏸ Pause</button>
        <button class="secondary" id="guideBtn" onclick="toggleGuide()">Toggle Guide</button>
      </div>

      <div class="instructions">
        <strong>Shortcuts:</strong> <b>Left / Right</b>: ±1 Frame &bull; <b>Shift + Left / Right</b>: ±7 Frames &bull; <b>Space</b>: Play/Pause.<br>
        <i>Click any table row to jump directly to that frame.</i>
      </div>
    </div>

    <!-- Right Column: Pre-Populated Data Table -->
    <div class="card table-card">
      <h2 style="font-size: 1.15rem; margin: 0 0 10px 0;">Observation Table</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Frame</th>
              <th>Time (s)</th>
              <th>Position <i>y</i> (cm)</th>
              <th>Instantaneous Velocity <i>v<sub>y</sub></i> (cm/s)</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Dynamically populated rows 0, 7, ..., 105 -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const vid = document.getElementById('vid');
    const timeDisplay = document.getElementById('timeDisplay');
    const frameDisplay = document.getElementById('frameDisplay');
    const playBtn = document.getElementById('playBtn');
    const hairline = document.getElementById('hairline');
    const container = document.getElementById('videoContainer');
    const tableBody = document.getElementById('tableBody');

    // --- TIMING CONSTANTS ---
    const EXPORTED_FPS = 30;         
    const CAPTURE_FPS = 215;         
    const FRAME_DURATION = 1 / EXPORTED_FPS;       
    const REAL_DT_PER_FRAME = 1 / CAPTURE_FPS;    // 0.004167 s
    const STEP_SIZE = 7;
    const MAX_FRAME = 105;

    let zeroFrame = 0;
    let guideActive = true;
    let animationFrameId = null;

    // Build the observation table for frames 0, 7, 14, ..., 105
    const rowsData = [];
    for (let f = 0; f <= MAX_FRAME; f += STEP_SIZE) {
      rowsData.push({ frame: f, time: f * REAL_DT_PER_FRAME, y: null });
    }

    function createTable() {
      tableBody.innerHTML = '';
      rowsData.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.id = `row-${row.frame}`;
        tr.onclick = (e) => {
          // Jump to frame when clicking row (unless typing in input)
          if (e.target.tagName !== 'INPUT') {
            jumpToFrame(row.frame);
          }
        };

        tr.innerHTML = `
          <td>${row.frame}</td>
          <td>${row.time.toFixed(4)}</td>
          <td>
            <input type="number" step="0.1" class="pos-input" id="input-${index}" 
                   placeholder="0.0" oninput="handlePosInput(${index}, this.value)">
          </td>
          <td class="vel-cell" id="vel-${index}">—</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    createTable();

    // Calculate instantaneous velocity using the Central Difference Method:
    // v_i = (y_{i+1} - y_{i-1}) / (t_{i+1} - t_{i-1})
    function calculateVelocities() {
      for (let i = 0; i < rowsData.length; i++) {
        const velCell = document.getElementById(`vel-${i}`);

        // Cannot compute central difference for first and last rows
        if (i === 0 || i === rowsData.length - 1) {
          velCell.textContent = '—';
          continue;
        }

        const prev = rowsData[i - 1];
        const next = rowsData[i + 1];

        if (prev.y !== null && !isNaN(prev.y) && next.y !== null && !isNaN(next.y)) {
          const dt = next.time - prev.time;
          const vy = (next.y - prev.y) / dt;
          velCell.textContent = vy.toFixed(1);
        } else {
          velCell.textContent = '—';
        }
      }
    }

    function handlePosInput(index, val) {
      const parsed = parseFloat(val);
      rowsData[index].y = isNaN(parsed) ? null : parsed;
      calculateVelocities();
    }

    function getCurrentFrame() {
      return Math.round(vid.currentTime * EXPORTED_FPS);
    }

    function updateDisplays() {
      const currentFrame = getCurrentFrame();
      const relativeFrame = currentFrame - zeroFrame;
      const realTime = relativeFrame * REAL_DT_PER_FRAME;

      timeDisplay.textContent = realTime.toFixed(4);
      frameDisplay.textContent = relativeFrame;

      // Highlight active row if current frame matches
      document.querySelectorAll('#tableBody tr').forEach(r => r.classList.remove('active-row'));
      const activeTr = document.getElementById(`row-${relativeFrame}`);
      if (activeTr) {
        activeTr.classList.add('active-row');
      }
    }

    function loopUpdate() {
      updateDisplays();
      if (!vid.paused) {
        animationFrameId = requestAnimationFrame(loopUpdate);
      }
    }

    vid.addEventListener('play', () => {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(loopUpdate);
      playBtn.className = 'play-active';
    });

    vid.addEventListener('pause', () => {
      cancelAnimationFrame(animationFrameId);
      playBtn.className = 'secondary';
      updateDisplays();
    });

    vid.addEventListener('ended', () => {
      playBtn.className = 'secondary';
    });

    vid.addEventListener('seeked', updateDisplays);

    function step(numFrames) {
      pauseVideo();
      const targetTime = vid.currentTime + (numFrames * FRAME_DURATION);
      vid.currentTime = Math.max(0, targetTime);
    }

    function jumpToFrame(targetFrame) {
      pauseVideo();
      vid.currentTime = (targetFrame + zeroFrame) * FRAME_DURATION;
    }

    function setZero() {
      zeroFrame = getCurrentFrame();
      updateDisplays();
    }

    function playSloMo() {
      if (vid.ended || vid.currentTime >= vid.duration - 0.05) {
        vid.currentTime = 0;
      }
      vid.playbackRate = 1.0;
      vid.play();
    }

    function pauseVideo() {
      vid.pause();
      playBtn.className = 'secondary';
    }

    function togglePlayPause() {
      if (vid.paused) {
        playSloMo();
      } else {
        pauseVideo();
      }
    }

    // Hairline guide
    container.addEventListener('mousemove', (e) => {
      if (!guideActive) return;
      const rect = container.getBoundingClientRect();
      const y = e.clientY - rect.top;
      hairline.style.top = y + 'px';
      hairline.style.display = 'block';
    });

    container.addEventListener('mouseleave', () => {
      hairline.style.display = 'none';
    });

    function toggleGuide() {
      guideActive = !guideActive;
      if (!guideActive) hairline.style.display = 'none';
    }

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      // Don't capture arrow keys while student is typing inside an input field
      if (e.target.tagName === 'INPUT') return;

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        step(e.shiftKey ? 7 : 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        step(e.shiftKey ? -7 : -1);
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlayPause();
      }
    });
  </script>
</body>
</html>
